# LSNR No Regularization Ablation Study
# This experiment tests LSNR without regularization to understand its impact

# Inherit from base configuration
_base_: "base.yaml"

# Experiment metadata
experiment:
  name: "lsnr_no_regularization"
  model: "lsnr"
  description: "LSNR without regularization - ablation study"
  tags: ["ablation", "lsnr", "no_regularization"]
  notes: "LSNR trained without regularization to measure its impact on performance"

# Model-specific overrides - disable regularization
models:
  lsnr:
    lambda_n: 0.0
    lambda_u: 0.0
    lambda_scheduler_steps: 5000
    lambda_scheduler_warmup: false

# Logging overrides
logging:
  wandb:
    project: "auto"
    tags: ["ablation", "lsnr", "no_regularization"]
    notes: "LSNR ablation: no regularization"
