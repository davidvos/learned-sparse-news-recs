# Configuration for Learned Sparse News Recommenders (LSNR).
#
# This file collects the shared defaults used by preprocessing, training, and
# evaluation.

# Global settings shared across scripts
global:
  seed: 42
  device: "auto"  # auto, cuda, mps, cpu
  min_interactions: 0

# Training defaults (individual experiments override as needed)
training:
  learning_rate: 0.00001
  batch_size: 16
  num_epochs: 100
  num_workers: 8
  eval_every: 500
  history_dropout: false
  history_dropout_prob: 0.5
  cold_threshold: 0
  enable_cold_start_eval: true
  eval_split: "val"  # val or test
  gradient_clip_norm: 1.0
  scheduler:
    type: "step"  # step, cosine, plateau
    step_size: 1000
    gamma: 0.9
  early_stopping:
    patience: 10
    monitor: "ret_ndcg10"
    mode: "max"

# Dataset specifications
datasets:
  mind:
    path: "./data/mind_small"
    num_clicked_news_a_user: 50
    num_words_title: 30
    num_words_abstract: 50
    pretrained_model_name: 'bert-base-uncased'
    star_pretrained_model_name: "naver/splade-cocondenser-ensembledistil"
    pad_clicked_history: true
    pad_candidate_news: true
    num_categories: 17
    num_subcategories: 264

  ebnerd:
    path: "./data/ebnerd"
    num_clicked_news_a_user: 50
    num_words_title: 20
    num_words_abstract: 30
    num_words_body: 50
    pretrained_model_name: "Maltehb/danish-bert-botxo"
    star_pretrained_model_name: "Maltehb/danish-bert-botxo"
    pad_clicked_history: true
    pad_candidate_news: true
    num_categories: 26
    num_subcategories: 83

# Model configurations
models:
  # Proposed Model
  lsnr:
    model: "lsnr"
    negative_sampling_ratio: 16
    num_attention_heads: 16
    query_vector_dim: 200
    dropout_probability: 0.2
    lambda_n: 0.01  # For candidate news
    lambda_history: 0.001  # For history news (lower = more expressive history)
    lambda_scheduler_steps: 0
    use_history_length_scaling: true
    freeze_bert_layers: 9
    use_asymmetric_projection: true  # When true, UserEncoder uses separate projection vs NewsEncoder

  # STAR: Sparse Text-based Attentive Ranker (bi-encoder with text concatenation)
  star:
    model: "star"
    negative_sampling_ratio: 16
    lambda_n: 0.01                 # FLOPS regularizer weight
    lambda_scheduler_steps: 50000
    lambda_scheduler_warmup: true
    freeze_bert_layers: 9
    max_user_tokens: 512           # Fill recent titles until this token limit
    gradient_checkpointing: true

  # Neural Baselines
  nrms:
    model: "nrms"
    negative_sampling_ratio: 4
    num_attention_heads: 16
    query_vector_dim: 200
    dropout_probability: 0.2
    freeze_bert_layers: 9

  naml:
    model: "naml"
    negative_sampling_ratio: 4
    num_attention_heads: 16
    query_vector_dim: 200
    dropout_probability: 0.2
    num_filters: 300
    window_size: 3
    category_embedding_dim: 100
    freeze_bert_layers: 9

  lstur:
    model: "lstur"
    negative_sampling_ratio: 4
    num_attention_heads: 16
    query_vector_dim: 200
    dropout_probability: 0.2
    num_filters: 300
    window_size: 3
    category_embedding_dim: 100
    num_users: 595706
    freeze_bert_layers: 9

  npa:
    model: "npa"
    negative_sampling_ratio: 4
    dropout_probability: 0.2
    num_users: 595706
    freeze_bert_layers: 9



# Logging configuration
logging:
  wandb:
    project: "auto"  # auto-generates based on dataset
    entity: null      # set to your wandb entity if needed
    tags: []
    notes: ""
  checkpoint:
    save_dir: "./checkpoints"
    save_best_only: true
    monitor: "val_auc"
    mode: "max"
