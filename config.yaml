negative_sampling_ratio: 4

mind: 
  path: './data/mind'
  num_clicked_news_a_user: 30
  num_words_title: 20
  num_words_abstract: 50
  pretrained_model_name: 'bert-base-uncased'

adressa:
  path: './data/adressa'
  num_clicked_news_a_user: 30
  num_words_title: 20
  num_words_abstract: 50
  pretrained_model_name: 'google-bert/bert-base-multilingual-cased'

ebnerd:
  path: './data/ebnerd'
  num_clicked_news_a_user: 30
  num_words_title: 20
  num_words_abstract: 50
  pretrained_model_name: 'google-bert/bert-base-multilingual-cased'

lsnr:
  model: 'lsnr'
  num_attention_heads: 16
  query_vector_dim: 200
  dropout_probability: 0.1
  sparsity_lambda: 0.001
  flops_lambda: 0.001
  # Optimized for sparse training
  max_seq_length: 512
  warmup_steps: 1000
  weight_decay: 0.01

lsnr_cat:
  model: 'lsnr_cat'
  num_attention_heads: 16
  query_vector_dim: 200
  dropout_probability: 0.2
  num_filters: 768
  window_size: 3
  num_categories: 288
  # num_categories: 109
  category_embedding_dim: 100
  num_users: 94057
  # num_users: 30482

nrms:
  model: 'nrms'
  num_attention_heads: 16
  query_vector_dim: 200
  dropout_probability: 0.2

naml:
  model: 'naml'
  num_attention_heads: 16
  query_vector_dim: 200
  dropout_probability: 0.2
  num_filters: 300
  window_size: 3
  num_categories: 288
  # num_categories: 109
  category_embedding_dim: 100

lstur:
  model: 'lstur'
  num_attention_heads: 16
  query_vector_dim: 200
  dropout_probability: 0.2
  num_filters: 300
  window_size: 3
  num_categories: 288
  # num_categories: 109
  category_embedding_dim: 100
  num_users: 94057
  # num_users: 30482