  pretrained_model_name: 'google-bert/bert-base-multilingual-uncased'

lsnr:
  model: 'lsnr'
  num_attention_heads: 16
  query_vector_dim: 200
  dropout_probability: 0.1

nrms:
  model: 'nrms'
  num_attention_heads: 16
  query_vector_dim: 200
  dropout_probability: 0.2

naml:
  model: 'naml'
  num_attention_heads: 16
  query_vector_dim: 200
  dropout_probability: 0.2
  num_filters: 300
  window_size: 3
  num_categories: 288
  # num_categories: 109
  category_embedding_dim: 100

lstur:
  model: 'lstur'
  num_attention_heads: 16
  query_vector_dim: 200
  dropout_probability: 0.2
  num_filters: 300
  window_size: 3
  num_categories: 288
  # num_categories: 109
  category_embedding_dim: 100
  num_users: 94057
